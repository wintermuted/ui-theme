name: Deploy Showcase to GitHub Pages
# This workflow manages the gh-pages branch directly so per-PR preview
# subdirectories persist across main-branch deployments.
# The Pages source is configured automatically via the GitHub API —
# no manual Settings → Pages configuration is required.

on:
  push:
    branches:
      - main
    paths:
      - "showcase/**"
      - "styles/**"
      - "index.css"
      - ".github/workflows/deploy-showcase-pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "showcase/**"
      - "styles/**"
      - "index.css"
      - ".github/workflows/deploy-showcase-pages.yml"
  workflow_dispatch:

# contents: write  — push to gh-pages branch
# pages: write     — configure Pages source via API
# pull-requests: write — post/update preview comment
permissions:
  contents: write
  pages: write
  pull-requests: write

# Per-PR concurrency so different PRs deploy in parallel; main has its own slot.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages-main' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp -R showcase _site/
          cp -R styles _site/
          cp index.css _site/

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout gh-pages worktree
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add --detach ./gh-pages-out FETCH_HEAD
          else
            # First run: create an empty orphan branch
            git worktree add --orphan -b gh-pages ./gh-pages-out
            touch ./gh-pages-out/.nojekyll
          fi

      - name: Deploy main site to gh-pages root
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          # Sync site to root, preserving pr-*/ preview subdirectories
          rsync -a --delete \
            --exclude='pr-*' \
            --exclude='.nojekyll' \
            --exclude='.git' \
            _site/ gh-pages-out/
          touch gh-pages-out/.nojekyll
          cd gh-pages-out
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Deploy main: ${{ github.sha }}"
            git push origin HEAD:refs/heads/gh-pages
          fi

      - name: Ensure GitHub Pages serves from gh-pages branch (main deploy)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: pages } = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              if (!pages.source || pages.source.branch !== 'gh-pages') {
                await github.rest.repos.updateInformationAboutPagesSite({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  source: { branch: 'gh-pages', path: '/' },
                });
                console.log('Updated Pages source to gh-pages branch.');
              } else {
                console.log('Pages source is already gh-pages. No change needed.');
              }
            } catch (err) {
              if (err.status === 404) {
                await github.rest.repos.createPagesSite({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  source: { branch: 'gh-pages', path: '/' },
                });
                console.log('Created Pages site from gh-pages branch.');
              } else {
                throw err;
              }
            }

      - name: Deploy PR preview to subdirectory
        if: github.event_name == 'pull_request'
        run: |
          PREVIEW_DIR="pr-${{ github.event.pull_request.number }}/${{ github.run_id }}"
          mkdir -p "gh-pages-out/${PREVIEW_DIR}"
          cp -R _site/. "gh-pages-out/${PREVIEW_DIR}/"
          # Store Unix epoch timestamp for age-based cleanup
          date -u +%s > "gh-pages-out/${PREVIEW_DIR}/.deployed-at"
          touch gh-pages-out/.nojekyll
          cd gh-pages-out
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "PR preview: pr-${{ github.event.pull_request.number }} / run-${{ github.run_id }}"
            git push origin HEAD:refs/heads/gh-pages
          fi

      - name: Post or update PR preview comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // Ensure Pages is serving from the gh-pages branch.
            // Runs after the deploy steps so the branch is guaranteed to exist.
            // Note: GITHUB_TOKEN cannot change the Pages source when it is already
            // set to "GitHub Actions" — that requires a one-time manual change in
            // Settings → Pages → Source → "Deploy from a branch → gh-pages / (root)".
            let pagesReady = false;
            try {
              const { data: pages } = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              if (!pages.source || pages.source.branch !== 'gh-pages') {
                await github.rest.repos.updateInformationAboutPagesSite({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  source: { branch: 'gh-pages', path: '/' },
                });
                console.log('Updated Pages source to gh-pages branch.');
                pagesReady = true;
              } else {
                pagesReady = true;
              }
            } catch (err) {
              if (err.status === 404) {
                try {
                  await github.rest.repos.createPagesSite({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    source: { branch: 'gh-pages', path: '/' },
                  });
                  console.log('Created Pages site from gh-pages branch.');
                  pagesReady = true;
                } catch (createErr) {
                  console.warn('Could not create Pages site:', createErr.message);
                }
              } else {
                // "Resource not accessible by integration" means the GITHUB_TOKEN
                // cannot override the current Pages source (e.g. set to GitHub Actions
                // by a previous actions/deploy-pages workflow on main). The user must
                // do this once manually.
                console.warn('Could not configure Pages source:', err.message);
                console.warn(
                  'ACTION REQUIRED: Go to Settings → Pages → Source and set it to ' +
                  '"Deploy from a branch → gh-pages / (root)", then re-run this workflow.'
                );
              }
            }

            const base = 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}';
            const previewUrl = `${base}/pr-${{ github.event.pull_request.number }}/${{ github.run_id }}/showcase/`;
            const sha = '${{ github.sha }}'.substring(0, 7);

            const setupNotice = pagesReady ? '' :
              '\n\n> ⚠️ **One-time setup required** — GitHub Pages is currently configured to serve ' +
              'from GitHub Actions artifacts, not the `gh-pages` branch where previews are deployed.\n' +
              '> \n' +
              '> To enable previews:\n' +
              '> 1. Go to **[Settings → Pages](https://github.com/${{ github.repository }}/settings/pages)**\n' +
              '> 2. Under **Source**, select **"Deploy from a branch"**\n' +
              '> 3. Choose branch **`gh-pages`** and folder **`/ (root)`**, then **Save**\n' +
              '> \n' +
              '> The preview URL will resolve once Pages is pointing at the `gh-pages` branch.';

            const body = `🚀 **PR Preview deployed!**\n\n📖 [Open docs preview](${previewUrl})${setupNotice}\n\n_Build ID: \`${{ github.run_id }}\` — commit \`${sha}\`_`;
            const marker = '<!-- showcase-preview-comment -->';
            const markedBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: markedBody,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: markedBody,
              });
            }
