name: Deploy Showcase to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "showcase/**"
      - "styles/**"
      - "index.css"
      - ".github/workflows/deploy-showcase-pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "showcase/**"
      - "styles/**"
      - "index.css"
      - ".github/workflows/deploy-showcase-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -R showcase _site/
          cp -R styles _site/
          cp index.css _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pageUrl = '${{ steps.deployment.outputs.page_url }}';
            const previewUrl = pageUrl.replace(/\/*$/, '/') + 'showcase/';
            const sha = '${{ github.sha }}'.substring(0, 7);
            const body = `🚀 **Live preview deployed!**\n\n📖 [Open docs preview](${previewUrl})\n\n> ⚠️ **Note:** this is a shared GitHub Pages URL — the preview reflects the most recent deployment from any branch. It will be overwritten once \`main\` is updated.\n\n_Last deployed: commit \`${sha}\`_`;
            const marker = '<!-- showcase-preview-comment -->';
            const markedBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: markedBody,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: markedBody,
              });
            }
