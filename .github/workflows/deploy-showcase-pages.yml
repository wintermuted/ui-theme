name: Deploy Showcase to GitHub Pages
# Deploys main to the Pages root while keeping PR previews under previews/pr-<number>/.
# This allows production and preview deployments to coexist on gh-pages.

on:
  push:
    branches:
      - main
    paths:
      - "showcase/**"
      - "styles/**"
      - "index.css"
      - ".github/workflows/deploy-showcase-pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "showcase/**"
      - "styles/**"
      - "index.css"
      - ".github/workflows/deploy-showcase-pages.yml"
  workflow_dispatch:

# contents: write  — push to gh-pages branch
# pull-requests: write — post/update preview comment
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp -R showcase _site/
          cp -R styles _site/
          cp index.css _site/
          touch _site/.nojekyll

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages (full replace)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add --detach ./gh-pages-out FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages ./gh-pages-out
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            preview_dir="gh-pages-out/previews/pr-${{ github.event.pull_request.number }}"
            rm -rf "$preview_dir"
            mkdir -p "$preview_dir"
            cp -R _site/. "$preview_dir/"
          else
            # Replace root content but preserve previews so PR links remain valid.
            find gh-pages-out -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'previews' -exec rm -rf {} +
            cp -R _site/. gh-pages-out/
          fi

          cd gh-pages-out
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Deploy (${{ github.event_name }}): ${{ github.sha }}"
            git push --force origin HEAD:refs/heads/gh-pages
          fi

      - name: Post PR preview comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const base = 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}';
            const previewUrl = `${base}/previews/pr-${{ github.event.pull_request.number }}/showcase/`;
            const sha = '${{ github.sha }}'.substring(0, 7);

            const body = `🚀 **PR Preview deployed!**\n\n📖 [Open showcase preview](${previewUrl})\n\n> ℹ️ Production remains at root Pages URL. This preview is isolated to PR #${{ github.event.pull_request.number }}.\n\n_Run \`${{ github.run_id }}\` — commit \`${sha}\`_`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
