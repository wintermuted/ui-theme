name: Cleanup PR Previews

on:
  # Remove a PR's entire preview directory when the PR is closed/merged
  pull_request:
    types: [closed]
  # Daily sweep: remove individual build directories older than RETENTION_DAYS
  schedule:
    - cron: '0 3 * * *'

env:
  RETENTION_DAYS: 2   # delete build dirs older than this many days

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check gh-pages branch exists
        id: check
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout gh-pages worktree
        if: steps.check.outputs.exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add --detach ./gh-pages-out FETCH_HEAD

      # ── On PR close: delete the entire pr-{number}/ directory ──────────────
      - name: Remove closed PR preview directory
        if: github.event_name == 'pull_request' && steps.check.outputs.exists == 'true'
        run: |
          PR_DIR="gh-pages-out/pr-${{ github.event.pull_request.number }}"
          if [ -d "$PR_DIR" ]; then
            rm -rf "$PR_DIR"
            cd gh-pages-out
            git add -A
            if ! git diff --staged --quiet; then
              git commit -m "Cleanup: remove preview for pr-${{ github.event.pull_request.number }}"
              git push origin HEAD:refs/heads/gh-pages
            fi
          else
            echo "No preview directory found for pr-${{ github.event.pull_request.number }}, nothing to clean."
          fi

      # ── Daily: remove build directories whose .deployed-at is > RETENTION_DAYS old
      # NOTE: Uses GNU date (+%s and -d @<epoch>) which is available on all
      #       ubuntu-latest GitHub Actions runners.
      - name: Remove PR build directories older than ${{ env.RETENTION_DAYS }} days
        if: github.event_name == 'schedule' && steps.check.outputs.exists == 'true'
        run: |
          CUTOFF=$(( $(date -u +%s) - (${{ env.RETENTION_DAYS }} * 86400) ))  # 86400 = seconds per day
          CHANGED=false

          # nullglob: unmatched globs expand to nothing rather than literal strings
          shopt -s nullglob
          for pr_dir in gh-pages-out/pr-*/; do
            [ -d "$pr_dir" ] || continue
            for build_dir in "$pr_dir"*/; do
              [ -d "$build_dir" ] || continue
              deployed_file="${build_dir}.deployed-at"
              if [ -f "$deployed_file" ]; then
                deployed_epoch=$(cat "$deployed_file")
                if [ "$deployed_epoch" -lt "$CUTOFF" ]; then
                  echo "Removing stale build: $build_dir (deployed at epoch ${deployed_epoch})"
                  rm -rf "$build_dir"
                  CHANGED=true
                fi
              fi
            done
            # If the PR directory is now empty, remove it too
            if [ -d "$pr_dir" ] && [ -z "$(ls -A "$pr_dir" 2>/dev/null)" ]; then
              rm -rf "$pr_dir"
            fi
          done

          if [ "$CHANGED" = true ]; then
            cd gh-pages-out
            git add -A
            if ! git diff --staged --quiet; then
              git commit -m "Scheduled cleanup: remove PR preview builds older than ${{ env.RETENTION_DAYS }} days"
              git push origin HEAD:refs/heads/gh-pages
            fi
          else
            echo "No stale builds found."
          fi
